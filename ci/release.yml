name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --onefile --noconsole --uac-admin --icon assets/icon.ico --name GameOptimizer main.py
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\GameOptimizer.exe -Algorithm SHA256).Hash | Out-File dist\GameOptimizer.exe.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/GameOptimizer.exe
            dist/GameOptimizer.exe.sha256
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: GameOptimizer
          path: dist/GameOptimizer.exe
